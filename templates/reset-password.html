<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System STT – Odzyskaj hasło</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style-login.css') }}">
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <div class="brand-icon">
            <i class="bi bi-envelope-at-fill"></i>
        </div>

        <h1 class="login-title">Odzyskaj hasło</h1>
        <p class="login-subtitle">Podaj swój adres e-mail – wyślemy Ci 6-cyfrowy kod weryfikacyjny</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('reset_password_request') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label for="email" class="form-label">Adres e-mail</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="nazwa@domena.pl" required autocomplete="email" autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Wyślij kod</button>
        </form>

        <div class="register-link" style="margin-top:20px;">
            <a href="{{ url_for('login') }}"><i class="bi bi-arrow-left"></i> Wróć do logowania</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
